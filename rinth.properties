# The Minecraft release this tree targets. `rinth fetch` refuses anything that doesn't match
# these hashes, so every machine decompiles the exact same bytes and the patches apply
# everywhere. Update all three lines together when moving to a new drop.
minecraft.version=26.3
minecraft.versionJson.sha1=61fff1316bd50312624a858bbb5eb18fa45208ed
minecraft.client.sha1=e877b6a07acd633fb3bb475002175cec036e7b87

# The Rinth online service's WebSocket URL (ADR 0058), built into the client; empty turns accounts
# off. -Printh.online.url overrides it at build time, ?online= and -Printh.online at run time.
# Rinth Client: Rinth's own service on rinthclient.com (its Worker), with the site's accounts.
rinth.online.url=wss://rinthclient.com/v1/ws

# This tree's Rinth Client version (one to four numbers: 0.2.0) and its public repository. A
# release build (-Pteavm.release) whose version is older than the latest release the online service
# names shows an update notice on the title screen, linking here. Raise the version with each release.
rinth.version=0.1.2
rinth.repository=https://github.com/attob-xd/rinth-client

# The servers pinned atop the server list, marked Sponsored, that players can't delete (ADR 0062):
# "name|address" entries joined by ";". The online service's hello may replace them for a run. Empty
# for none (a self-hosted build may want its own).
rinth.featured=Carrotcraft|wss://eagler.carrot-craft.org

# The look players start in: rinth (Frost, ADR 0048) or vanilla, Minecraft's own menus, font,
# panorama and loading screen. -Printh.look overrides it at build time; players switch it in Rinth
# Settings (from the next start), and the page's ?look=rinth or ?look=vanilla picks one for a run.
rinth.look=vanilla
